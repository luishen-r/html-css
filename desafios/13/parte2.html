<!DOCTYPE html>
<html lang="ptbr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        td, th{
            border: 1px solid black;
            padding: 8px;
        }
        table{
            border-collapse: collapse;
        }
        .th{
            background-color: grey;
            color: white;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th class="th" rowspan="2" scope="col">Área</th>
                <th class="th" rowspan="2" scope="col">Disciplinas</th>
                <th class="th" colspan="2" scope="colgroup">Notas</th>
                <th class="th" rowspan="2" scope="col">Média</th>
            </tr>
            <tr>
                <th class="th" scope="col">Nota 1</th>
                <th class="th" scope="col">Nota 2</th>    
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
            </tr>
            <tr>
                <td class="th" colspan="4">Média de exatas</td>
                <td class="th">0</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
            </tr>
            <tr>
                <td class="th" colspan="4">Média de humanas</td>
                <td class="th">0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
