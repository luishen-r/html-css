<!DOCTYPE html>
<html lang="ptbr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela responsiva</title>
    <style>
         body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 500px;
            border-collapse: collapse;
            position: relative;
            width: 50vw;
        }
        td, th{
            border: 1px solid black;
            padding: 10px;
        }
    
        caption{
            font-size: 1.3em;
            font-weight: bold;

        }
       th:nth-child(odd){
            background-color: lightgray;
        }
        caption{
            height: 35px;
            padding-top: 5px;
        }
        .container{
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Tabelas em telas pequenas</h1>
    <div class="container">
        <table>
            <caption>Tabela responsiva</caption>
            <tr>
                <thead>
                    <th>Produto</th>
                    <th>jan</th>
                    <th>Fev</th>
                    <th>Mar</th>
                    <th>abr</th>
                    <th>mai</th>
                    <th>jun</th>
                    <th>jul</th>
                    <th>ago</th>
                    <th>set</th>
                    <th>out</th>
                    <th>nov</th>
                    <th>dez</th>
                </thead>
        </table>
    </div>
</body>
</html>
